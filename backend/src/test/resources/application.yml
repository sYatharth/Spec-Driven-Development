# Test profile: isolated in-memory H2 so tests never touch the dev file DB.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

app:
  cors:
    allowed-origin: http://localhost:5173

logging:
  level:
    com.support.tickets: WARN
